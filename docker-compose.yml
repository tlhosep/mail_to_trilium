services:
  email_to_trilium:
    build: .
    container_name: email_to_trilium
    restart: always
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "2"
    labels:
      - "wud.trigger.exclude=dockercompose.gitlab"
      - "wud.watch=true"
      - "wud.watch.digest=true"
      - "wud.trigger=docker.qnap"